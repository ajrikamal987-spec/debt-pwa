<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0284c7" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-512.png" />

<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DEBT" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2314b8a6'/%3E%3Cstop offset='.55' stop-color='%230284c7'/%3E%3Cstop offset='1' stop-color='%231d4ed8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='120' height='120' rx='26' fill='url(%23g)'/%3E%3Crect x='24' y='34' width='72' height='46' rx='10' fill='white'/%3E%3Cpath d='M24 46a10 10 0 0 1 10-10h52a10 10 0 0 1 10 10v6H24z' fill='%23e0f2fe'/%3E%3Ccircle cx='78' cy='62' r='9' fill='%23f0b429'/%3E%3Ctext x='60' y='104' text-anchor='middle' font-family='Arial,sans-serif' font-size='19' font-weight='700' fill='white' letter-spacing='3'%3EDEBT%3C/text%3E%3C/svg%3E" />
<title>DEBT — Catat Hutang</title>
<style>
  :root{
    --grad: linear-gradient(135deg,#0d9488 0%,#0284c7 55%,#1d4ed8 100%);
    --grad-soft: linear-gradient(135deg,#14b8a6,#0284c7 60%,#2563eb);
    --gold:#f0b429; --gold-strong:#d99a06;
    --green:#16a34a; --amber:#d97706; --red:#dc2626;
    --radius:16px;
    --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:#06182b; --bg2:#081f38;
    --surface:#0b2745; --surface2:#0e3054; --surface3:#123c66;
    --text:#eaf4fc; --muted:#9db8cf; --faint:#6f93b3;
    --border:#1d4568; --input:#081f38;
    --gold-text:#ffd34d;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --chip:#123c66;
  }
  html[data-theme="light"]{
    color-scheme: light;
    --bg:#eef5fa; --bg2:#e2eef7;
    --surface:#ffffff; --surface2:#f0f6fb; --surface3:#e2eef7;
    --text:#0b2239; --muted:#4d657d; --faint:#7d97ad;
    --border:#cfdfec; --input:#f4f9fc;
    --gold-text:#9a6b00;
    --shadow:0 10px 26px rgba(8,60,110,.14);
    --chip:#e2eef7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:var(--bg); color:var(--text);
    min-height:100dvh;
    transition:background .3s ease,color .3s ease;
  }
  button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.75rem;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:1rem; color:var(--text);}
  .hidden{display:none !important;}

  /* ---------- Splash ---------- */
  #splash{
    position:fixed; inset:0; z-index:200;
    background:var(--grad);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #splash.leaving{animation:splashOut .45s ease forwards;}
  @keyframes splashOut{to{opacity:0; transform:scale(1.06); visibility:hidden;}}
  .splash-stage{position:relative; width:190px; height:190px; display:flex; align-items:center; justify-content:center;}
  .splash-logo-in{animation:logoIn .45s ease both;}
  @keyframes logoIn{from{opacity:0; transform:scale(.82);}to{opacity:1; transform:scale(1);}}
  .splash-wallet{width:172px; height:172px; filter:drop-shadow(0 18px 30px rgba(0,20,50,.35));}
  .splash-zoom{animation:zoomIn 3s ease forwards; transform-origin:center;}
  @keyframes zoomIn{
    0%,33%{transform:scale(1);}
    72%{transform:scale(1.04);}
    100%{transform:scale(1.22);}
  }
  .wallet-flap{transform-origin:60px 44px; animation:flapOpen 1.9s ease .95s both;}
  @keyframes flapOpen{
    0%,18%{transform:rotate(0deg);}
    55%,100%{transform:rotate(-24deg) translateY(-4px);}
  }
  .coin{opacity:0;}
  .coin1{animation:coinDrop 1s ease 1.25s both;}
  .coin2{animation:coinDrop 1s ease 1.45s both;}
  .coin3{animation:coinDrop 1s ease 1.65s both;}
  @keyframes coinDrop{
    0%{opacity:0; transform:translateY(-34px);}
    25%{opacity:1;}
    70%{opacity:1; transform:translateY(8px);}
    100%{opacity:0; transform:translateY(20px) scale(.7);}
  }
  .splash-name{
    margin-top:10px; color:#fff; font-size:2rem; font-weight:800; letter-spacing:.35em; text-indent:.35em;
    animation:logoIn .5s ease .15s both;
  }
  .splash-sub{color:rgba(255,255,255,.85); font-size:.9rem; margin-top:4px; animation:logoIn .5s ease .3s both;}
  #splashSkip{
    position:absolute; right:16px; bottom:calc(18px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.45);
    border-radius:999px; padding:.55rem 1.2rem; font-size:.95rem; font-weight:600; min-height:2.75rem;
  }

  /* ---------- Lock screen ---------- */
  #lockScreen{
    position:fixed; inset:0; z-index:150; overflow-y:auto;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(2,132,199,.35), transparent 60%),
      var(--bg);
    display:flex; flex-direction:column; align-items:center;
    padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
  }
  .lock-logo{width:104px; height:104px; margin-top:4vh;}
  .lock-title{margin:18px 0 2px; font-size:1.15rem; font-weight:700; text-align:center;}
  .lock-msg{min-height:1.4em; margin:6px 0 4px; font-size:.92rem; color:var(--muted); text-align:center; max-width:320px;}
  .lock-msg.error{color:#f87171;}
  html[data-theme="light"] .lock-msg.error{color:var(--red);}
  .pin-dots{display:flex; gap:14px; justify-content:center; margin:16px 0 22px; min-height:16px;}
  .pin-dot{width:15px; height:15px; border-radius:50%; border:2px solid var(--faint); transition:all .15s ease;}
  .pin-dot.filled{background:var(--gold); border-color:var(--gold); transform:scale(1.12);}
  .pin-dots.shake{animation:shake .4s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-9px);}40%{transform:translateX(9px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
  .keypad{
    display:grid; grid-template-columns:repeat(3,76px); gap:14px; justify-content:center;
  }
  .key-btn{
    width:76px; height:64px; border-radius:50%/46%;
    border:1px solid var(--border); background:var(--surface);
    font-size:1.55rem; font-weight:600; color:var(--text);
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, background .12s ease;
    opacity:0;
  }
  .keypad.enter .key-btn{animation:keyIn .32s ease both; animation-delay:var(--d,0ms);}
  @keyframes keyIn{from{opacity:0; transform:scale(.7) translateY(10px);}to{opacity:1; transform:scale(1) translateY(0);}}
  .key-btn:active,.key-btn.pressed{transform:scale(1.14); background:var(--surface3);}
  .key-btn.fn{font-size:1rem; background:transparent; border-color:transparent; color:var(--muted);}
  .key-btn:disabled{opacity:.35 !important;}
  .lock-actions{display:flex; flex-direction:column; gap:10px; align-items:center; margin-top:22px; width:100%; max-width:300px;}
  .btn{
    border:none; border-radius:12px; padding:.7rem 1.1rem; font-size:1rem; font-weight:700;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:3rem;
  }
  .btn-primary{background:var(--grad-soft); color:#fff; box-shadow:0 6px 16px rgba(2,132,199,.35);}
  .btn-gold{background:linear-gradient(135deg,#f6c445,#e79b06); color:#231a00;}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border); font-weight:600;}
  .btn-soft{background:var(--surface2); color:var(--text); border:1px solid var(--border); font-weight:600;}
  .btn-danger{background:transparent; color:#f87171; border:1px solid rgba(220,38,38,.4); font-weight:600;}
  html[data-theme="light"] .btn-danger{color:var(--red);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .link-btn{background:none; border:none; color:#38bdf8; font-size:.95rem; font-weight:600; padding:.5rem 1rem; min-height:2.75rem;}
  html[data-theme="light"] .link-btn{color:#0277bd;}
  .lock-form{width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; margin-top:8px;}
  .lockout-note{color:#fbbf24; font-size:.92rem; text-align:center; min-height:1.3em;}
  html[data-theme="light"] .lockout-note{color:var(--amber);}

  /* ---------- App layout ---------- */
  #app{max-width:600px; margin:0 auto; padding:0 16px calc(40px + env(safe-area-inset-bottom));}
  header.app-header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:12px;
    padding:calc(12px + env(safe-area-inset-top)) 2px 12px;
    background:var(--bg);
  }
  .header-logo{width:46px; height:46px; flex:none;}
  .header-title{font-size:1.35rem; font-weight:800; letter-spacing:.12em; line-height:1;}
  .header-sub{font-size:.82rem; color:var(--muted); margin-top:3px;}
  .gear-btn{
    margin-left:auto; width:46px; height:46px; flex:none;
    border-radius:14px; border:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:var(--text);
  }
  .gear-btn svg{width:23px; height:23px;}

  .totals{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:6px 0 16px;}
  .total-card{
    border-radius:var(--radius); padding:16px 14px; color:#fff; position:relative; overflow:hidden;
    background:var(--grad); box-shadow:var(--shadow); border:none; text-align:left; width:100%;
  }
  .total-card.alt{background:linear-gradient(135deg,#0f766e,#0e7490 60%,#0369a1);}
  .total-label{font-size:.78rem; font-weight:700; letter-spacing:.14em; opacity:.92;}
  .total-value{font-size:1.42rem; font-weight:800; color:#ffe08a; margin-top:6px; line-height:1.15; word-break:break-word;}
  .total-sub{font-size:.78rem; opacity:.85; margin-top:4px;}

  .tabs{display:flex; background:var(--surface2); border:1px solid var(--border); border-radius:14px; padding:4px; gap:4px; margin-bottom:14px;}
  .tab-btn{
    flex:1; border:none; background:transparent; color:var(--muted); font-weight:700; font-size:.98rem;
    border-radius:10px; padding:.65rem .5rem; min-height:2.9rem;
  }
  .tab-btn.active{background:var(--grad-soft); color:#fff; box-shadow:0 4px 12px rgba(2,132,199,.3);}

  .controls{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
  .search-wrap{position:relative;}
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:19px; height:19px; color:var(--faint); pointer-events:none;}
  .field{
    width:100%; background:var(--input); border:1px solid var(--border); border-radius:12px;
    padding:.68rem .9rem; min-height:3rem;
  }
  .search-wrap .field{padding-left:40px;}
  .field:focus{outline:2px solid #0284c7; outline-offset:0; border-color:#0284c7;}
  .controls-row{display:flex; gap:10px;}
  .controls-row .field{flex:1; min-width:0;}
  .controls-row label{flex:1; display:flex; flex-direction:column; gap:4px; font-size:.75rem; font-weight:700; letter-spacing:.06em; color:var(--muted); min-width:0;}
  textarea.field{min-height:4.2rem; resize:vertical;}

  .add-main{width:100%; margin-bottom:16px; font-size:1.02rem;}

  /* ---------- Person cards ---------- */
  .person{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .person-top{display:flex; align-items:center; gap:12px;}
  .avatar{
    width:46px; height:46px; border-radius:50%; flex:none;
    background:var(--grad-soft); color:#fff; font-weight:800; font-size:1.15rem;
    display:flex; align-items:center; justify-content:center;
  }
  .person-name{font-size:1.08rem; font-weight:700; line-height:1.2; word-break:break-word;}
  .person-due{font-size:.8rem; color:var(--muted); margin-top:2px;}
  .person-remaining{margin-left:auto; text-align:right; flex:none;}
  .person-remaining .lbl{font-size:.68rem; font-weight:700; letter-spacing:.1em; color:var(--faint);}
  .person-remaining .val{font-size:1.12rem; font-weight:800; color:var(--gold-text);}
  .badge{
    display:inline-block; font-size:.7rem; font-weight:700; letter-spacing:.03em;
    padding:.22rem .55rem; border-radius:999px; margin-top:6px; white-space:nowrap;
  }
  .badge-lunas{background:rgba(22,163,74,.16); color:#4ade80;}
  html[data-theme="light"] .badge-lunas{color:var(--green);}
  .badge-belum{background:var(--chip); color:var(--muted);}
  .badge-dekat{background:rgba(217,119,6,.18); color:#fbbf24;}
  html[data-theme="light"] .badge-dekat{color:var(--amber);}
  .badge-lewat{background:rgba(220,38,38,.16); color:#f87171;}
  html[data-theme="light"] .badge-lewat{color:var(--red);}
  .person-meta{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:.85rem; color:var(--muted); margin-top:12px;}
  .person-meta b{color:var(--text); font-weight:600;}
  .progress{height:9px; background:var(--surface3); border-radius:99px; overflow:hidden; margin-top:10px;}
  .progress > div{height:100%; background:linear-gradient(90deg,#14b8a6,#38bdf8); border-radius:99px; transition:width .4s ease;}
  .progress-lbl{font-size:.76rem; color:var(--faint); margin-top:5px;}
  .person-actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .person-actions .btn{flex:1; min-width:120px; font-size:.92rem; padding:.6rem .6rem; min-height:2.9rem;}
  .debt-detail{border-top:1px dashed var(--border); margin-top:14px; padding-top:12px;}
  .debt-item{background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px;}
  .debt-item-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .debt-amount{font-weight:800; font-size:1rem;}
  .debt-info{font-size:.82rem; color:var(--muted); margin-top:3px; line-height:1.5;}
  .debt-note{font-size:.85rem; margin-top:6px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 9px;}
  .debt-actions{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .mini-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:9px; padding:.45rem .7rem; font-size:.83rem; font-weight:600; min-height:2.5rem;
    display:inline-flex; align-items:center; gap:5px;
  }
  .mini-btn.danger{color:#f87171; border-color:rgba(220,38,38,.35);}
  html[data-theme="light"] .mini-btn.danger{color:var(--red);}
  .pay-list{margin-top:10px;}
  .pay-title{font-size:.78rem; font-weight:700; letter-spacing:.06em; color:var(--faint); margin-bottom:6px;}
  .pay-row{
    display:flex; align-items:center; gap:8px; font-size:.87rem;
    padding:7px 0; border-top:1px solid var(--border);
  }
  .pay-row:first-of-type{border-top:none;}
  .pay-amt{font-weight:700; color:#4ade80;}
  html[data-theme="light"] .pay-amt{color:var(--green);}
  .pay-meta{color:var(--muted); font-size:.8rem;}
  .pay-row .mini-btn{min-height:2.25rem; padding:.3rem .55rem; font-size:.78rem;}
  .pay-actions{margin-left:auto; display:flex; gap:5px; flex:none;}
  .empty{
    text-align:center; padding:38px 20px; color:var(--muted);
    border:1.5px dashed var(--border); border-radius:var(--radius); background:var(--surface);
  }
  .empty .big{font-size:1.05rem; font-weight:700; color:var(--text); margin-bottom:6px;}

  /* ---------- Modal / sheet ---------- */
  .modal-backdrop{
    position:fixed; inset:0; z-index:300; background:rgba(2,12,24,.62);
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media(min-width:640px){ .modal-backdrop{align-items:center; padding:20px;} }
  .modal{
    background:var(--surface); color:var(--text); width:100%; max-width:560px; max-height:92dvh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    animation:sheetUp .25s ease both;
  }
  @media(min-width:640px){ .modal{border-radius:20px;} }
  @keyframes sheetUp{from{transform:translateY(26px); opacity:.4;}to{transform:translateY(0); opacity:1;}}
  .modal h2{margin:0 0 4px; font-size:1.18rem;}
  .modal .desc{color:var(--muted); font-size:.9rem; margin:0 0 14px; line-height:1.5;}
  .form-group{margin-bottom:13px;}
  .form-group label{display:block; font-size:.82rem; font-weight:700; margin-bottom:6px; color:var(--muted);}
  .form-group .opt{font-weight:500; color:var(--faint);}
  .form-row{display:flex; gap:10px;}
  .form-row .form-group{flex:1; min-width:0;}
  .form-error{color:#f87171; font-size:.88rem; min-height:1.2em; margin:2px 0 8px;}
  html[data-theme="light"] .form-error{color:var(--red);}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions .btn{flex:1;}
  .settings-section{border-top:1px solid var(--border); padding:16px 0 4px; margin-top:16px;}
  .settings-section:first-of-type{border-top:none; margin-top:2px; padding-top:6px;}
  .settings-section h3{margin:0 0 4px; font-size:1rem;}
  .settings-section p{margin:0 0 12px; font-size:.86rem; color:var(--muted); line-height:1.5;}
  .seg{display:flex; background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:4px; gap:4px;}
  .seg button{
    flex:1; border:none; background:transparent; color:var(--muted); font-weight:700; font-size:.9rem;
    border-radius:9px; padding:.6rem .3rem; min-height:2.8rem;
  }
  .seg button.active{background:var(--grad-soft); color:#fff;}
  .settings-stack{display:flex; flex-direction:column; gap:10px;}
  .summary-box{
    background:var(--surface2); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; font-size:.92rem; line-height:1.65; margin-bottom:6px;
  }
  .warn-box{
    background:rgba(217,119,6,.12); border:1px solid rgba(217,119,6,.4); border-radius:12px;
    padding:11px 13px; font-size:.86rem; line-height:1.55; margin-top:12px; color:var(--text);
  }
  #toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
    background:#0b2745; color:#fff; border:1px solid #1d4568; padding:.75rem 1.15rem; border-radius:12px;
    font-size:.92rem; font-weight:600; z-index:400; opacity:0; pointer-events:none; transition:all .25s ease;
    box-shadow:0 12px 30px rgba(0,0,0,.4); max-width:88vw; text-align:center;
  }
  html[data-theme="light"] #toast{background:#0b2745;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important;}
    .key-btn{opacity:1;}
  }
</style>
</head>
<body>

<!-- Logo DEBT: dompet putih + koin emas di atas gradasi teal-biru -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="debtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/><stop offset=".55" stop-color="#0284c7"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <symbol id="logoDebt" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="26" fill="url(#debtGrad)"/>
      <g class="wallet-art">
        <rect x="24" y="36" width="72" height="44" rx="10" fill="#ffffff"/>
        <path class="wallet-flap-art" d="M24 47a11 11 0 0 1 11-11h50a11 11 0 0 1 11 11v5H24z" fill="#bae6fd"/>
        <rect x="24" y="50" width="72" height="4" fill="#e0f2fe"/>
        <circle cx="79" cy="63" r="10" fill="#f0b429"/>
        <circle cx="79" cy="63" r="6.5" fill="#ffd34d"/>
      </g>
      <text x="60" y="105" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="3">DEBT</text>
    </symbol>
    <symbol id="logoSplash" viewBox="0 0 120 120">

<script>
"use strict";
/* ================= Utilitas ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const rp = (n) => "Rp " + Math.round(Number(n) || 0).toLocaleString("id-ID");
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const fmtDate = (iso) => { if (!iso) return "—"; const d = new Date(iso + "T12:00:00"); if (isNaN(d)) return "—"; return d.toLocaleDateString("id-ID", { day:"numeric", month:"short", year:"numeric" }); };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const reducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let toastTimer = null;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ================= Penyimpanan (hanya di perangkat ini) ================= */
const LS = {
  get(k, def){ try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch(e){ return def; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const K = {
  pin: "debtMandiri.pin", sec: "debtMandiri.sec",
  debts: "debtMandiri.debts", sort: "debtMandiri.sort",
  mode: "debtMandiri.mode", lastExport: "debtMandiri.lastExport",
  pinAtt: "debtMandiri.pinAtt", ansAtt: "debtMandiri.ansAtt"
};

let debts = LS.get(K.debts, []);
let sortMode = LS.get(K.sort, "jumlah");
let modePref = LS.get(K.mode, "auto");
let currentTab = "hutang";
let expandedKeys = new Set();
let unlocked = false;

function saveDebts(){ LS.set(K.debts, debts); }

/* ================= Hash (PIN & jawaban tidak disimpan sebagai teks biasa) ================= */
function randomSalt(){
  const a = new Uint8Array(16);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
  return Array.from(a).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function hashText(text, salt){
  const data = salt + "::" + text;
  if (window.crypto && crypto.subtle && window.isSecureContext !== false) {
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(data));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    } catch(e){ /* lanjut ke fallback */ }
  }
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let round = 0; round < 64; round++){
    for (let i = 0; i < data.length; i++){
      h1 = Math.imul(h1 ^ data.charCodeAt(i), 0x01000193) >>> 0;
      h2 = Math.imul(h2 ^ (data.charCodeAt(i) + round), 0x85ebca6b) >>> 0;
    }
  }
  return h1.toString(16).padStart(8, "0") + h2.toString(16).padStart(8, "0");
}
const normAnswer = (s) => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");

/* ================= Tema: Otomatis / Mode Putih / Mode Malam ================= */
function effectiveTheme(){
  if (modePref === "light") return "light";
  if (modePref === "dark") return "dark";
  const h = new Date().getHours();
  return (h >= 6 && h < 18) ? "light" : "dark";
}
function applyTheme(){ document.documentElement.setAttribute("data-theme", effectiveTheme()); }
applyTheme();
setInterval(() => { if (modePref === "auto") applyTheme(); }, 60000);

/* ================= Perhitungan hutang ================= */
const paidOf = (d) => (d.payments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
const sisaOf = (d) => Math.max(0, (Number(d.amount) || 0) - paidOf(d));
function statusOf(d){
  if (sisaOf(d) <= 0) return "Lunas";
  if (d.dueDate){
    const now = new Date(); now.setHours(0,0,0,0);
    const due = new Date(d.dueDate + "T00:00:00");
    const diff = Math.round((due - now) / 86400000);
    if (diff < 0) return "Lewat Jatuh Tempo";
    if (diff <= 7) return "Jatuh Tempo Dekat";
  }
  return "Belum Lunas";
}
const STATUS_ORDER = { "Lewat Jatuh Tempo": 0, "Jatuh Tempo Dekat": 1, "Belum Lunas": 2, "Lunas": 3 };
const badgeClass = (s) => ({ "Lunas":"badge-lunas", "Belum Lunas":"badge-belum", "Jatuh Tempo Dekat":"badge-dekat", "Lewat Jatuh Tempo":"badge-lewat" }[s] || "badge-belum");
const personKey = (name) => String(name || "").trim().toLowerCase().replace(/\s+/g, " ");

function groupPersons(dir){
  const map = new Map();
  debts.filter(d => d.direction === dir).forEach(d => {
    const k = personKey(d.name);
    if (!map.has(k)) map.set(k, { key: k, name: d.name, debts: [] });
    map.get(k).debts.push(d);
  });
  const persons = Array.from(map.values()).map(p => {
    const total = p.debts.reduce((s, d) => s + (Number(d.amount) || 0), 0);
    const paid = p.debts.reduce((s, d) => s + paidOf(d), 0);
    const sisa = Math.max(0, total - paid);
    const status = p.debts.map(statusOf).sort((a, b) => STATUS_ORDER[a] - STATUS_ORDER[b])[0];
    const dues = p.debts.filter(d => d.dueDate && sisaOf(d) > 0).map(d => d.dueDate).sort();
    const dates = p.debts.map(d => d.startDate).filter(Boolean).sort();
    return { ...p, total, paid, sisa, status, nearestDue: dues[0] || null, latestDate: dates.length ? dates[dates.length - 1] : null };
  });
  if (sortMode === "tanggal"){
    persons.sort((a, b) => {
      if (a.latestDate && b.latestDate) return b.latestDate.localeCompare(a.latestDate);
      if (a.latestDate) return -1;
      if (b.latestDate) return 1;
      return b.sisa - a.sisa;
    });
  } else {
    persons.sort((a, b) => (b.sisa - a.sisa) || (b.total - a.total));
  }
  return persons;
}

/* ================= Splash 3 detik ================= */
let splashDone = false, splashTimer = null;
function finishSplash(){
  if (splashDone) return;
  splashDone = true;
  clearTimeout(splashTimer);
  const sp = $("#splash");
  sp.classList.add("leaving");
  setTimeout(() => sp.classList.add("hidden"), reducedMotion() ? 0 : 420);
  showLock();
}
function startSplash(){
  if (reducedMotion()){ $("#splash").classList.add("hidden"); splashDone = true; showLock(); return; }
  splashTimer = setTimeout(finishSplash, 3000);
  $("#splash").addEventListener("click", finishSplash);
  $("#splashSkip").addEventListener("click", (e) => { e.stopPropagation(); finishSplash(); });
  $("#splash").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") finishSplash(); });
}

/* ================= Layar kunci & PIN ================= */
let lockView = "unlock"; // unlock | setupPin | setupConfirm | setupQ | forgot | resetPin | resetConfirm
let pinBuf = "";
let tempPin = "";
let lockInterval = null;

function attempts(key){
  const a = LS.get(key, { count: 0, lockUntil: 0 });
  if (a.lockUntil && Date.now() > a.lockUntil) return { count: 0, lockUntil: 0 };
  return a;
}
function registerFail(key){
  const a = attempts(key);
  a.count = (a.count || 0) + 1;
  if (a.count >= 5){ a.lockUntil = Date.now() + 60000; a.count = 0; }
  LS.set(key, a);
  return a;
}
const isLockedOut = (key) => attempts(key).lockUntil > Date.now();
const lockSecondsLeft = (key) => Math.max(0, Math.ceil((attempts(key).lockUntil - Date.now()) / 1000));

function showLock(){
  unlocked = false;
  $("#app").classList.add("hidden");
  $("#lockScreen").classList.remove("hidden");
  pinBuf = ""; tempPin = "";
  lockView = LS.get(K.pin, null) ? "unlock" : "setupPin";
  renderLock(true);
}
function lockNow(){ if (LS.get(K.pin, null)) showLock(); }

function renderLock(animateKeys){
  const c = $("#lockContent");
  clearInterval(lockInterval);
  const pinRec = LS.get(K.pin, null);
  let title = "", msg = "", extra = "";

  if (lockView === "unlock"){ title = "Masukkan PIN"; }
  else if (lockView === "setupPin"){ title = "Buat PIN Baru"; msg = "Buat PIN 4–6 angka untuk mengunci catatanmu di perangkat ini."; }
  else if (lockView === "setupConfirm"){ title = "Ulangi PIN"; msg = "Masukkan lagi PIN yang sama untuk memastikan."; }
  else if (lockView === "resetPin"){ title = "Buat PIN Baru"; msg = "Jawaban benar. Sekarang buat PIN baru 4–6 angka."; }
  else if (lockView === "resetConfirm"){ title = "Ulangi PIN Baru"; }

  if (lockView === "setupQ"){
    c.innerHTML = `
      <div class="lock-title">Pertanyaan Keamanan</div>
      <p class="lock-msg">Dipakai kalau kamu lupa PIN. Buat pertanyaan dan jawabanmu sendiri.</p>
      <form class="lock-form" id="secForm">
        <input class="field" id="secQ" type="text" placeholder="Pertanyaan, contoh: Siapa nama ibumu?" autocomplete="off" required />
        <input class="field" id="secA" type="text" placeholder="Jawabanmu" autocomplete="off" required />
        <div class="lock-msg error" id="secErr"></div>
        <button class="btn btn-primary btn-block" type="submit">Simpan &amp; Masuk</button>
      </form>`;
    $("#secForm").addEventListener("submit", saveSecuritySetup);
    return;
  }

  if (lockView === "forgot"){
    const sec = LS.get(K.sec, null);
    const lockedOut = isLockedOut(K.ansAtt);
    c.innerHTML = `
      <div class="lock-title">Lupa PIN</div>
      <p class="lock-msg">${sec ? "Jawab pertanyaan keamanan yang kamu buat saat pertama kali." : "Pertanyaan keamanan belum diatur di perangkat ini."}</p>
      ${sec ? `
      <form class="lock-form" id="forgotForm">
        <div class="summary-box" style="width:100%; text-align:center; font-weight:700;">${esc(sec.question)}</div>
        <input class="field" id="ansInput" type="text" placeholder="Jawabanmu" autocomplete="off" ${lockedOut ? "disabled" : ""} />
        <div class="lockout-note" id="ansLockNote">${lockedOut ? "Terlalu banyak jawaban salah. Coba lagi dalam " + lockSecondsLeft(K.ansAtt) + " detik." : ""}</div>
        <div class="lock-msg error" id="ansErr"></div>
        <button class="btn btn-primary btn-block" type="submit" ${lockedOut ? "disabled" : ""}>Periksa Jawaban</button>
        <button class="btn btn-ghost btn-block" type="button" id="backToUnlock">Kembali</button>
      </form>` : `
      <div class="lock-actions">
        <button class="btn btn-soft btn-block" type="button" id="backToUnlock">Kembali ke PIN</button>
      </div>`}`;
    const back = $("#backToUnlock");
    if (back) back.addEventListener("click", () => { lockView = "unlock"; pinBuf = ""; renderLock(true); });
    const form = $("#forgotForm");
    if (form) form.addEventListener("submit", checkAnswer);
    if (lockedOut){
      lockInterval = setInterval(() => { if (!isLockedOut(K.ansAtt)) renderLock(true); else { const n = $("#ansLockNote"); if (n) n.textContent = "Terlalu banyak jawaban salah. Coba lagi dalam " + lockSecondsLeft(K.ansAtt) + " detik."; } }, 500);
    }
    return;
  }

  /* Tampilan papan angka (unlock / buat PIN / konfirmasi) */
  const lockedOut = lockView === "unlock" && isLockedOut(K.pinAtt);
  const maxDots = lockView === "unlock" ? (pinRec ? pinRec.len : 6) : 6;
  const dots = Array.from({ length: Math.max(pinBuf.length, 0) }, () => 1);
  extra = `
    <div class="pin-dots" id="pinDots">${Array.from({length: maxDots}, (_, i) => `<span class="pin-dot${i < pinBuf.length ? " filled" : ""}"></span>`).join("")}</div>
    <div class="lockout-note" id="pinLockNote">${lockedOut ? "PIN salah 5 kali. Tunggu " + lockSecondsLeft(K.pinAtt) + " detik." : ""}</div>
    <div class="keypad${animateKeys ? " enter" : ""}" id="keypad"></div>
    <div class="lock-actions">
      ${(lockView === "setupPin" || lockView === "resetPin") ? `<button class="btn btn-primary btn-block" id="pinNext" ${pinBuf.length >= 4 ? "" : "disabled"}>Lanjut</button>` : ""}
      ${lockView === "unlock" ? `<button class="link-btn" id="forgotBtn" type="button">Lupa PIN?</button>` : ""}
      ${(lockView === "setupConfirm" || lockView === "resetConfirm" || lockView === "forgot") ? "" : ""}
    </div>`;
  c.innerHTML = `<div class="lock-title">${title}</div><p class="lock-msg" id="lockMsg">${msg}</p>${extra}`;
  buildKeypad(lockedOut);
  if (lockedOut){
    lockInterval = setInterval(() => {
      if (!isLockedOut(K.pinAtt)) renderLock(true);
      else { const n = $("#pinLockNote"); if (n) n.textContent = "PIN salah 5 kali. Tunggu " + lockSecondsLeft(K.pinAtt) + " detik."; }
    }, 500);
  }
  const next = $("#pinNext");
  if (next) next.addEventListener("click", () => {
    if (pinBuf.length < 4) return;
    tempPin = pinBuf; pinBuf = "";
    lockView = lockView === "setupPin" ? "setupConfirm" : "resetConfirm";
    renderLock(true);
  });
  const fb = $("#forgotBtn");
  if (fb) fb.addEventListener("click", () => { lockView = "forgot"; pinBuf = ""; renderLock(false); });
}

function buildKeypad(disabled){
  const kp = $("#keypad");
  if (!kp) return;
  kp.innerHTML = "";
  const keys = ["1","2","3","4","5","6","7","8","9","","0","back"];
  keys.forEach((k, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "key-btn" + (k === "" || k === "back" ? " fn" : "");
    b.style.setProperty("--d", (i * 45) + "ms");
    b.setAttribute("aria-label", k === "back" ? "Hapus angka" : (k ? "Angka " + k : ""));
    if (k === "back") b.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5H9L2 12l7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>';
    else b.textContent = k;
    if (disabled || k === "") b.disabled = true;
    if (k !== "") b.addEventListener("click", () => pressKey(k, b));
    kp.appendChild(b);
  });
}
function updateDots(){
  const dotsEl = $("#pinDots");
  if (!dotsEl) return;
  $$(".pin-dot", dotsEl).forEach((d, i) => d.classList.toggle("filled", i < pinBuf.length));
  const next = $("#pinNext");
  if (next) next.disabled = pinBuf.length < 4;
}
function pressKey(k, btn){
  if (btn){ btn.classList.add("pressed"); setTimeout(() => btn.classList.remove("pressed"), 140); }
  if (k === "back"){ pinBuf = pinBuf.slice(0, -1); updateDots(); return; }
  if (pinBuf.length >= 6) return;
  pinBuf += k;
  updateDots();
  const pinRec = LS.get(K.pin, null);
  if (lockView === "unlock" && pinRec && pinBuf.length === pinRec.len) setTimeout(tryUnlock, 120);
  if ((lockView === "setupConfirm" || lockView === "resetConfirm") && pinBuf.length === tempPin.length) setTimeout(tryConfirm, 120);
}
function shakeDots(msg){
  const dotsEl = $("#pinDots");
  if (dotsEl){ dotsEl.classList.remove("shake"); void dotsEl.offsetWidth; dotsEl.classList.add("shake"); }
  const m = $("#lockMsg");
  if (m){ m.textContent = msg; m.classList.add("error"); }
}
async function tryUnlock(){
  const pinRec = LS.get(K.pin, null);
  if (!pinRec) return;
  const h = await hashText(pinBuf, pinRec.salt);
  if (h === pinRec.hash){
    LS.set(K.pinAtt, { count: 0, lockUntil: 0 });
    pinBuf = "";
    enterApp();
  } else {
    pinBuf = "";
    updateDots();
    const a = registerFail(K.pinAtt);
    if (a.lockUntil > Date.now()){ renderLock(true); }
    else shakeDots("PIN salah. Coba lagi.");
  }
}
async function tryConfirm(){
  if (pinBuf !== tempPin){
    pinBuf = ""; updateDots();
    shakeDots("PIN tidak sama. Ulangi dari awal.");
    setTimeout(() => { lockView = lockView === "resetConfirm" ? "resetPin" : "setupPin"; tempPin = ""; renderLock(true); }, 900);
    return;
  }
  const wasReset = lockView === "resetConfirm";
  const salt = randomSalt();
  const hash = await hashText(tempPin, salt);
  LS.set(K.pin, { salt, hash, len: tempPin.length });
  LS.set(K.pinAtt, { count: 0, lockUntil: 0 });
  LS.set(K.ansAtt, { count: 0, lockUntil: 0 });
  tempPin = ""; pinBuf = "";
  if (wasReset){ toast("PIN baru berhasil disimpan."); enterApp(); }
  else {
    const sec = LS.get(K.sec, null);
    if (sec) enterApp();
    else { lockView = "setupQ"; renderLock(false); }
  }
}
async function saveSecuritySetup(e){
  e.preventDefault();
  const q = $("#secQ").value.trim();
  const a = normAnswer($("#secA").value);
  if (!q || !a){ $("#secErr").textContent = "Pertanyaan dan jawaban wajib diisi."; return; }
  const salt = randomSalt();
  const hash = await hashText(a, salt);
  LS.set(K.sec, { question: q, salt, hash });
  toast("Pertanyaan keamanan tersimpan.");
  enterApp();
}
async function checkAnswer(e){
  e.preventDefault();
  const sec = LS.get(K.sec, null);
  if (!sec) return;
  const a = normAnswer($("#ansInput").value);
  const h = await hashText(a, sec.salt);
  if (h === sec.hash){
    LS.set(K.ansAtt, { count: 0, lockUntil: 0 });
    lockView = "resetPin"; pinBuf = ""; tempPin = "";
    renderLock(true);
  } else {
    const att = registerFail(K.ansAtt);
    if (att.lockUntil > Date.now()) renderLock(false);
    else { const err = $("#ansErr"); if (err) err.textContent = "Jawaban salah. Coba lagi."; }
  }
}
function enterApp(){
  unlocked = true;
  clearInterval(lockInterval);
  $("#lockScreen").classList.add("hidden");
  $("#app").classList.remove("hidden");
  render();
}

/* Kunci otomatis: 1 menit di latar belakang */
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden){ hiddenAt = Date.now(); }
  else {
    if (unlocked && hiddenAt && Date.now() - hiddenAt > 60000) lockNow();
    hiddenAt = 0;
  }
});
window.addEventListener("pagehide", () => { hiddenAt = Date.now(); });
window.addEventListener("pageshow", () => {
  if (unlocked && hiddenAt && Date.now() - hiddenAt > 60000) lockNow();
});
</script>

<script>
"use strict";
/* ================= Modal umum ================= */
function openModal(html){
  const root = $("#modalRoot");
  root.innerHTML = `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $(".modal-backdrop", root).addEventListener("click", (e) => { if (e.target.classList.contains("modal-backdrop")) closeModal(); });
  return $(".modal", root);
}
function closeModal(){ $("#modalRoot").innerHTML = ""; }
function confirmModal(title, text, okLabel){
  return new Promise((resolve) => {
    const m = openModal(`
      <h2>${esc(title)}</h2><p class="desc">${esc(text)}</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cfNo" type="button">Batal</button>
        <button class="btn btn-primary" id="cfYes" type="button">${esc(okLabel || "Ya, Lanjutkan")}</button>
      </div>`);
    $("#cfNo", m).addEventListener("click", () => { closeModal(); resolve(false); });
    $("#cfYes", m).addEventListener("click", () => { closeModal(); resolve(true); });
  });
}

/* ================= Render daftar ================= */
function render(){
  const th = groupPersons("hutang"), tp = groupPersons("piutang");
  const sumH = th.reduce((s, p) => s + p.sisa, 0), sumP = tp.reduce((s, p) => s + p.sisa, 0);
  $("#totalHutang").textContent = rp(sumH);
  $("#totalPiutang").textContent = rp(sumP);
  $("#totalHutangSub").textContent = th.length + " orang · sisa belum dibayar";
  $("#totalPiutangSub").textContent = tp.length + " orang · sisa belum kembali";
  $("#tabHutang").classList.toggle("active", currentTab === "hutang");
  $("#tabPiutang").classList.toggle("active", currentTab === "piutang");
  $("#addBtn").textContent = currentTab === "hutang" ? "+ Tambah Hutang" : "+ Tambah Piutang";
  $("#sortSelect").value = sortMode;

  const q = $("#searchInput").value.trim().toLowerCase();
  const f = $("#filterStatus").value;
  let persons = groupPersons(currentTab);
  if (q) persons = persons.filter(p => p.name.toLowerCase().includes(q));
  if (f !== "semua") persons = persons.filter(p => p.debts.some(d => statusOf(d) === f));

  const list = $("#list");
  if (!persons.length){
    const hasAny = groupPersons(currentTab).length > 0;
    list.innerHTML = `<div class="empty">
      <div class="big">${hasAny ? "Tidak ada hasil" : (currentTab === "hutang" ? "Belum ada hutang" : "Belum ada piutang")}</div>
      <div>${hasAny ? "Coba ubah kata pencarian atau filter status." : (currentTab === "hutang" ? "Total hutangmu masih Rp 0. Ketuk tombol tambah untuk mencatat hutang pertama." : "Belum ada yang berhutang ke kamu. Ketuk tombol tambah untuk mencatat.")}</div>
    </div>`;
    return;
  }
  list.innerHTML = persons.map(p => personHTML(p)).join("");
  bindPersonEvents();
}
function personHTML(p){
  const pct = p.total > 0 ? Math.min(100, Math.round(p.paid / p.total * 100)) : 100;
  const expanded = expandedKeys.has(p.key + "|" + currentTab);
  const cicilanLabel = currentTab === "hutang" ? "Catat Cicilan" : "Catat Pembayaran";
  let detail = "";
  if (expanded){
    detail = `<div class="debt-detail">` + p.debts.map(d => debtHTML(d)).join("") + `</div>`;
  }
  return `<article class="person">
    <div class="person-top">
      <div class="avatar">${esc((p.name.trim()[0] || "?").toUpperCase())}</div>
      <div style="min-width:0;">
        <div class="person-name">${esc(p.name)}</div>
        <div class="person-due">${p.nearestDue ? "Jatuh tempo terdekat: " + fmtDate(p.nearestDue) : (p.debts.length + " catatan hutang")}</div>
        <span class="badge ${badgeClass(p.status)}">${esc(p.status)}</span>
      </div>
      <div class="person-remaining"><div class="lbl">SISA</div><div class="val">${rp(p.sisa)}</div></div>
    </div>
    <div class="person-meta">
      <span>Total: <b>${rp(p.total)}</b></span>
      <span>Sudah dibayar: <b>${rp(p.paid)}</b></span>
      <span>Sisa: <b>${rp(p.sisa)}</b></span>
    </div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="progress-lbl">${pct}% lunas</div>
    <div class="person-actions">
      <button class="btn btn-gold" data-act="cicilan" data-key="${esc(p.key)}" type="button">${cicilanLabel}</button>
      <button class="btn btn-soft" data-act="tambah" data-key="${esc(p.key)}" type="button">+ Tambah Hutang Baru</button>
      <button class="btn btn-ghost" data-act="detail" data-key="${esc(p.key)}" type="button">${expanded ? "Tutup Detail" : "Detail"}</button>
    </div>
    ${detail}
  </article>`;
}
function debtHTML(d){
  const paid = paidOf(d), sisa = sisaOf(d), st = statusOf(d);
  const pct = d.amount > 0 ? Math.min(100, Math.round(paid / d.amount * 100)) : 100;
  const pays = (d.payments || []).slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const payHTML = pays.length ? `<div class="pay-list"><div class="pay-title">RIWAYAT PEMBAYARAN</div>` + pays.map(pay => `
    <div class="pay-row">
      <span class="pay-amt">${rp(pay.amount)}</span>
      <span class="pay-meta">${fmtDate(pay.date)}${pay.note ? " · " + esc(pay.note) : ""}</span>
      <span class="pay-actions">
        <button class="mini-btn" data-act="editpay" data-debt="${d.id}" data-pay="${pay.id}" type="button">Edit</button>
        <button class="mini-btn danger" data-act="delpay" data-debt="${d.id}" data-pay="${pay.id}" type="button">Hapus</button>
      </span>
    </div>`).join("") + `</div>` : "";
  return `<div class="debt-item">
    <div class="debt-item-top">
      <div>
        <div class="debt-amount">${rp(d.amount)}</div>
        <div class="debt-info">
          Tanggal hutang: ${d.startDate ? fmtDate(d.startDate) : "tidak diisi"}<br/>
          Jatuh tempo: ${d.dueDate ? fmtDate(d.dueDate) : "tidak diisi"}<br/>
          Sudah dibayar: ${rp(paid)} · Sisa: <b>${rp(sisa)}</b>
        </div>
      </div>
      <span class="badge ${badgeClass(st)}">${esc(st)}</span>
    </div>
    ${d.note ? `<div class="debt-note">${esc(d.note)}</div>` : ""}
    <div class="progress"><div style="width:${pct}%"></div></div>
    ${payHTML}
    <div class="debt-actions">
      ${sisa > 0 ? `<button class="mini-btn" data-act="cicilan1" data-debt="${d.id}" type="button">Catat Cicilan</button>` : ""}
      <button class="mini-btn" data-act="editdebt" data-debt="${d.id}" type="button">Edit</button>
      <button class="mini-btn danger" data-act="deldebt" data-debt="${d.id}" type="button">Hapus</button>
    </div>
  </div>`;
}
function findPerson(key){
  return groupPersons(currentTab).find(p => p.key === key);
}
function bindPersonEvents(){
  $$("#list [data-act]").forEach(btn => {
    btn.addEventListener("click", () => {
      const act = btn.dataset.act, key = btn.dataset.key;
      if (act === "detail"){ const k = key + "|" + currentTab; expandedKeys.has(k) ? expandedKeys.delete(k) : expandedKeys.add(k); render(); }
      if (act === "tambah"){ const p = findPerson(key); openDebtForm(null, currentTab, p ? p.name : ""); }
      if (act === "cicilan"){ const p = findPerson(key); if (p) openCicilanForm(p, null); }
      if (act === "cicilan1"){ const d = debts.find(x => x.id === btn.dataset.debt); if (d){ const p = findPerson(personKey(d.name)); if (p) openCicilanForm(p, d.id); } }
      if (act === "editdebt"){ const d = debts.find(x => x.id === btn.dataset.debt); if (d) openDebtForm(d, d.direction, d.name); }
      if (act === "deldebt"){ deleteDebt(btn.dataset.debt); }
      if (act === "editpay"){ openPaymentForm(btn.dataset.debt, btn.dataset.pay.id || btn.dataset.pay); }
      if (act === "delpay"){ deletePayment(btn.dataset.debt, btn.dataset.pay); }
    });
  });
}

/* ================= Formulir hutang ================= */
function openDebtForm(existing, direction, presetName){
  const isEdit = !!existing;
  const d = existing || { name: presetName || "", amount: "", startDate: "", dueDate: "", note: "" };
  const title = isEdit ? "Edit Hutang" : (direction === "hutang" ? "Tambah Hutang Baru" : "Tambah Piutang Baru");
  const m = openModal(`
    <h2>${title}</h2>
    <p class="desc">${direction === "hutang" ? "Hutangmu ke orang ini. Nama yang sama akan digabung jadi satu bar." : "Uangmu yang dipinjam orang ini. Nama yang sama akan digabung jadi satu bar."}</p>
    <form id="debtForm">
      <div class="form-group"><label>Nama</label><input class="field" id="fName" type="text" value="${esc(d.name)}" placeholder="Nama orang" autocomplete="off" required /></div>
      <div class="form-group"><label>Jumlah (Rp)</label><input class="field" id="fAmount" type="number" inputmode="numeric" min="1" value="${d.amount || ""}" placeholder="Contoh: 500000" required /></div>
      <div class="form-row">
        <div class="form-group"><label>Tanggal Hutang <span class="opt">(boleh kosong)</span></label><input class="field" id="fStart" type="date" value="${esc(d.startDate || "")}" /></div>
        <div class="form-group"><label>Jatuh Tempo <span class="opt">(boleh kosong)</span></label><input class="field" id="fDue" type="date" value="${esc(d.dueDate || "")}" /></div>
      </div>
      <div class="form-group"><label>Catatan <span class="opt">(boleh kosong)</span></label><textarea class="field" id="fNote" placeholder="Contoh: pinjam untuk modal usaha">${esc(d.note || "")}</textarea></div>
      <div class="form-error" id="fErr"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" id="fCancel">Batal</button>
        <button class="btn btn-primary" type="submit">${isEdit ? "Simpan Perubahan" : "Simpan"}</button>
      </div>
    </form>`);
  $("#fCancel", m).addEventListener("click", closeModal);
  $("#debtForm", m).addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("#fName", m).value.trim();
    const amount = Number($("#fAmount", m).value);
    if (!name){ $("#fErr", m).textContent = "Nama wajib diisi."; return; }
    if (!amount || amount <= 0){ $("#fErr", m).textContent = "Jumlah harus lebih dari 0."; return; }
    const start = $("#fStart", m).value || "";
    const due = $("#fDue", m).value || "";
    if (start && due && due < start){ $("#fErr", m).textContent = "Jatuh tempo tidak boleh sebelum tanggal hutang."; return; }
    if (isEdit){
      existing.name = name; existing.amount = amount; existing.startDate = start; existing.dueDate = due; existing.note = $("#fNote", m).value.trim();
      toast("Hutang diperbarui.");
    } else {
      debts.push({ id: uid(), name, direction, amount, startDate: start, dueDate: due, note: $("#fNote", m).value.trim(), payments: [], createdAt: new Date().toISOString() });
      expandedKeys.add(personKey(name) + "|" + direction);
      toast("Hutang tersimpan.");
    }
    saveDebts(); closeModal(); render();
  });
}
async function deleteDebt(id){
  const d = debts.find(x => x.id === id);
  if (!d) return;
  const ok = await confirmModal("Hapus Hutang?", `Hutang ${esc(d.name)} sebesar ${rp(d.amount)} beserta riwayat pembayarannya akan dihapus permanen.`, "Ya, Hapus");
  if (!ok) return;
  debts = debts.filter(x => x.id !== id);
  saveDebts(); render(); toast("Hutang dihapus.");
}

/* ================= Formulir cicilan ================= */
function openCicilanForm(person, presetDebtId){
  const unpaid = person.debts.filter(d => sisaOf(d) > 0);
  if (!unpaid.length){ toast("Semua hutang " + person.name + " sudah lunas."); return; }
  const m = openModal(`
    <h2>${currentTab === "hutang" ? "Catat Cicilan" : "Catat Pembayaran"} — ${esc(person.name)}</h2>
    <p class="desc">Bayar sedikit demi sedikit juga bisa. Sisa hutang berkurang sendiri dan tercatat di riwayat.</p>
    <form id="payForm">
      <div class="form-group"><label>Untuk Hutang</label>
        <select class="field" id="pDebt">${unpaid.map(d => `<option value="${d.id}" ${d.id === presetDebtId ? "selected" : ""}>${rp(d.amount)} · sisa ${rp(sisaOf(d))}${d.startDate ? " · " + fmtDate(d.startDate) : ""}</option>`).join("")}</select>
      </div>
      <div class="form-group"><label>Jumlah Cicilan (Rp)</label><input class="field" id="pAmount" type="number" inputmode="numeric" min="1" placeholder="Contoh: 50000" required /></div>
      <button class="btn btn-soft btn-block" type="button" id="pLunas" style="margin-bottom:13px;">Bayar Lunas (isi sisa penuh)</button>
      <div class="form-row">
        <div class="form-group"><label>Tanggal Bayar</label><input class="field" id="pDate" type="date" value="${todayISO()}" /></div>
        <div class="form-group"><label>Catatan <span class="opt">(boleh kosong)</span></label><input class="field" id="pNote" type="text" placeholder="Contoh: transfer" autocomplete="off" /></div>
      </div>
      <div class="form-error" id="pErr"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" id="pCancel">Batal</button>
        <button class="btn btn-gold" type="submit">Simpan Cicilan</button>
      </div>
    </form>`);
  const selDebt = () => debts.find(x => x.id === $("#pDebt", m).value);
  $("#pLunas", m).addEventListener("click", () => { const d = selDebt(); if (d) $("#pAmount", m).value = sisaOf(d); });
  $("#pCancel", m).addEventListener("click", closeModal);
  $("#payForm", m).addEventListener("submit", (e) => {
    e.preventDefault();
    const d = selDebt(); if (!d) return;
    const amount = Number($("#pAmount", m).value);
    if (!amount || amount <= 0){ $("#pErr", m).textContent = "Jumlah cicilan harus lebih dari 0."; return; }
    if (amount > sisaOf(d)){ $("#pErr", m).textContent = "Jumlah melebihi sisa hutang (" + rp(sisaOf(d)) + ")."; return; }
    d.payments = d.payments || [];
    d.payments.push({ id: uid(), amount, date: $("#pDate", m).value || todayISO(), note: $("#pNote", m).value.trim() });
    saveDebts(); closeModal(); render();
    toast(sisaOf(d) <= 0 ? "Lunas! Cicilan tersimpan." : "Cicilan tersimpan. Sisa sekarang " + rp(sisaOf(d)) + ".");
  });
}
function openPaymentForm(debtId, payId){
  const d = debts.find(x => x.id === debtId);
  if (!d) return;
  const pay = (d.payments || []).find(p => p.id === payId);
  if (!pay) return;
  const m = openModal(`
    <h2>Edit Pembayaran</h2>
    <p class="desc">Pembayaran untuk hutang ${esc(d.name)} sebesar ${rp(d.amount)}.</p>
    <form id="editPayForm">
      <div class="form-group"><label>Jumlah (Rp)</label><input class="field" id="epAmount" type="number" inputmode="numeric" min="1" value="${pay.amount}" required /></div>
      <div class="form-row">
        <div class="form-group"><label>Tanggal Bayar</label><input class="field" id="epDate" type="date" value="${esc(pay.date || "")}" /></div>
        <div class="form-group"><label>Catatan</label><input class="field" id="epNote" type="text" value="${esc(pay.note || "")}" autocomplete="off" /></div>
      </div>
      <div class="form-error" id="epErr"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" id="epCancel">Batal</button>
        <button class="btn btn-primary" type="submit">Simpan</button>
      </div>
    </form>`);
  $("#epCancel", m).addEventListener("click", closeModal);
  $("#editPayForm", m).addEventListener("submit", (e) => {
    e.preventDefault();
    const amount = Number($("#epAmount", m).value);
    const otherPaid = (d.payments || []).filter(p => p.id !== payId).reduce((s, p) => s + (Number(p.amount) || 0), 0);
    if (!amount || amount <= 0){ $("#epErr", m).textContent = "Jumlah harus lebih dari 0."; return; }
    if (otherPaid + amount > d.amount){ $("#epErr", m).textContent = "Total pembayaran melebihi jumlah hutang."; return; }
    pay.amount = amount; pay.date = $("#epDate", m).value || pay.date; pay.note = $("#epNote", m).value.trim();
    saveDebts(); closeModal(); render(); toast("Pembayaran diperbarui.");
  });
}
async function deletePayment(debtId, payId){
  const d = debts.find(x => x.id === debtId);
  if (!d) return;
  const pay = (d.payments || []).find(p => p.id === payId);
  if (!pay) return;
  const ok = await confirmModal("Hapus Pembayaran?", `Pembayaran ${rp(pay.amount)} tanggal ${fmtDate(pay.date)} akan dihapus dan sisa hutang bertambah lagi.`, "Ya, Hapus");
  if (!ok) return;
  d.payments = d.payments.filter(p => p.id !== payId);
  saveDebts(); render(); toast("Pembayaran dihapus.");
}

/* ================= Pengaturan ================= */
function openSettings(){
  const lastExp = LS.get(K.lastExport, "");
  const m = openModal(`
    <h2>Pengaturan</h2>
    <div class="settings-section">
      <h3>Mode Tampilan</h3>
      <p>Otomatis mengikuti jam perangkat: 06.00–18.00 Mode Putih, 18.00–06.00 Mode Malam.</p>
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="auto" class="${modePref === "auto" ? "active" : ""}">Otomatis</button>
        <button type="button" data-mode="light" class="${modePref === "light" ? "active" : ""}">Mode Putih</button>
        <button type="button" data-mode="dark" class="${modePref === "dark" ? "active" : ""}">Mode Malam</button>
      </div>
    </div>
    <div class="settings-section">
      <h3>Keamanan</h3>
      <p>PIN dan jawaban keamanan tersimpan teracak di perangkat ini, bukan teks biasa.</p>
      <div class="settings-stack">
        <button class="btn btn-soft btn-block" id="setChangePin" type="button">Ganti PIN</button>
        <button class="btn btn-soft btn-block" id="setChangeSec" type="button">Pertanyaan Keamanan</button>
      </div>
    </div>
    <div class="settings-section">
      <h3>Cadangan Data</h3>
      <p>File backup hanya berisi hutang dan pembayaran — tanpa PIN dan tanpa jawaban keamanan.${lastExp ? "<br/>Terakhir diekspor: " + fmtDate(lastExp.slice(0, 10)) + "." : ""}</p>
      <div class="settings-stack">
        <button class="btn btn-primary btn-block" id="expJson" type="button">Ekspor Backup (JSON)</button>
        <button class="btn btn-soft btn-block" id="expCsv" type="button">Ekspor ke CSV</button>
        <button class="btn btn-soft btn-block" id="impBtn" type="button">Pulihkan dari Backup</button>
      </div>
      <div class="warn-box">Simpan file cadangan di tempat aman dan jangan dibagikan ke orang lain — isinya catatan hutangmu.</div>
    </div>
    <div class="settings-section">
      <h3>Bagikan Aplikasi Ini</h3>
      <p>Unduh file HTML mandiri ini lalu kirim lewat WhatsApp atau Bluetooth. Di HP penerima, buka file-nya di Chrome, lalu pilih menu titik tiga → “Tambahkan ke Layar Utama”. Aplikasi mulai dari kosong dan datanya tersimpan hanya di HP itu.</p>
      <button class="btn btn-gold btn-block" id="dlHtml" type="button">Unduh File HTML Mandiri</button>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost btn-block" id="setClose" type="button">Tutup</button></div>`);
  $("#setClose", m).addEventListener("click", closeModal);
  $$("#modeSeg button", m).forEach(b => b.addEventListener("click", () => {
    modePref = b.dataset.mode; LS.set(K.mode, modePref); applyTheme();
    $$("#modeSeg button", m).forEach(x => x.classList.toggle("active", x === b));
    toast(b.dataset.mode === "auto" ? "Mode otomatis aktif." : (b.dataset.mode === "light" ? "Mode Putih aktif." : "Mode Malam aktif."));
  }));
  $("#setChangePin", m).addEventListener("click", openChangePin);
  $("#setChangeSec", m).addEventListener("click", openChangeSec);
  $("#expJson", m).addEventListener("click", exportJSON);
  $("#expCsv", m).addEventListener("click", exportCSV);
  $("#impBtn", m).addEventListener("click", () => { closeModal(); $("#importFile").click(); });
  $("#dlHtml", m).addEventListener("click", downloadStandalone);
}
function openChangePin(){
  const m = openModal(`
    <h2>Ganti PIN</h2>
    <form id="chgPinForm">
      <div class="form-group"><label>PIN Lama</label><input class="field" id="cpOld" type="password" inputmode="numeric" autocomplete="off" required /></div>
      <div class="form-group"><label>PIN Baru (4–6 angka)</label><input class="field" id="cpNew" type="password" inputmode="numeric" autocomplete="off" required /></div>
      <div class="form-group"><label>Ulangi PIN Baru</label><input class="field" id="cpNew2" type="password" inputmode="numeric" autocomplete="off" required /></div>
      <div class="form-error" id="cpErr"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" id="cpCancel">Batal</button>
        <button class="btn btn-primary" type="submit">Simpan PIN Baru</button>
      </div>
    </form>`);
  $("#cpCancel", m).addEventListener("click", openSettings);
  $("#chgPinForm", m).addEventListener("submit", async (e) => {
    e.preventDefault();
    const rec = LS.get(K.pin, null);
    const oldH = await hashText($("#cpOld", m).value, rec.salt);
    if (oldH !== rec.hash){ $("#cpErr", m).textContent = "PIN lama salah."; return; }
    const np = $("#cpNew", m).value.trim();
    if (!/^\d{4,6}$/.test(np)){ $("#cpErr", m).textContent = "PIN baru harus 4–6 angka."; return; }
    if (np !== $("#cpNew2", m).value.trim()){ $("#cpErr", m).textContent = "Pengulangan PIN baru tidak sama."; return; }
    const salt = randomSalt();
    LS.set(K.pin, { salt, hash: await hashText(np, salt), len: np.length });
    closeModal(); toast("PIN berhasil diganti.");
  });
}
function openChangeSec(){
  const sec = LS.get(K.sec, null);
  const m = openModal(`
    <h2>Pertanyaan Keamanan</h2>
    <p class="desc">Dipakai untuk reset PIN kalau kamu lupa. ${sec ? "Pertanyaan sekarang: <b>" + esc(sec.question) + "</b>" : "Belum diatur."}</p>

      <div class="form-group"><label>Pertanyaan Baru</label><input class="field" id="csQ" type="text" placeholder="Contoh: Siapa nama ibumu?" value="${sec ? esc(sec.question) : ""}" autocomplete="off" required /></div>
      <div class="form-group"><label>Jawaban Baru</label><input class="field" id="csA" type="text" autocomplete="off" required /></div>
      <div class="form-error" id="csErr"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" id="csCancel">Batal</button>
        <button class="btn btn-primary" type="submit">Simpan</button>
      </div>
    </form>`);
  $("#csCancel", m).addEventListener("click", openSettings);
  $("#chgSecForm", m).addEventListener("submit", async (e) => {
    e.preventDefault();

    const h = await hashText($("#csPin", m).value, rec.salt);

    closeModal(); toast("Pertanyaan keamanan diperbarui.");
  });
}

/* ================= Ekspor & pulihkan ================= */
function downloadBlob(content, filename, type){
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function stamp(){ const d = new Date(); return d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0"); }
function exportJSON(){
  const payload = { app: "DEBT", kind: "backup", version: 1, exportedAt: new Date().toISOString(), debts };
  downloadBlob(JSON.stringify(payload, null, 2), "debt-backup-" + stamp() + ".json", "application/json");
  LS.set(K.lastExport, payload.exportedAt);
  toast("File backup JSON terunduh.");
  openSettings();
}
function csvCell(v){ const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCSV(){
  const head = ["Nama","Arah","Jumlah","Sudah Dibayar","Sisa","Tanggal Hutang","Jatuh Tempo","Status","Catatan"];
  const rows = debts.map(d => [d.name, d.direction === "piutang" ? "Piutang" : "Hutang", d.amount, paidOf(d), sisaOf(d), d.startDate || "", d.dueDate || "", statusOf(d), d.note || ""]);
  const csv = "﻿" + [head].concat(rows).map(r => r.map(csvCell).join(",")).join("\r\n");
  downloadBlob(csv, "debt-" + stamp() + ".csv", "text/csv;charset=utf-8");
  toast("File CSV terunduh.");
}
function sanitizeDebt(raw){
  if (!raw || typeof raw !== "object") return null;
  const name = String(raw.name || "").trim();
  const amount = Number(raw.amount);
  if (!name || !amount || amount <= 0) return null;
  const payments = Array.isArray(raw.payments) ? raw.payments.map(p => ({
    id: p && p.id ? String(p.id) : uid(),
    amount: Math.max(0, Number(p && p.amount) || 0),
    date: p && p.date ? String(p.date) : "",
    note: p && p.note ? String(p.note) : ""
  })).filter(p => p.amount > 0) : [];
  return {
    id: raw.id ? String(raw.id) : uid(),
    name,
    direction: raw.direction === "piutang" ? "piutang" : "hutang",
    amount,
    startDate: raw.startDate ? String(raw.startDate) : "",
    dueDate: raw.dueDate ? String(raw.dueDate) : "",
    note: raw.note ? String(raw.note) : "",
    payments,
    createdAt: raw.createdAt ? String(raw.createdAt) : new Date().toISOString()
  };
}
$("#importFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  let parsed;
  try { parsed = JSON.parse(await file.text()); }
  catch(err){ toast("File tidak bisa dibaca. Pastikan file backup JSON DEBT."); return; }
  if (!parsed || parsed.app !== "DEBT" || !Array.isArray(parsed.debts)){
    toast("File ini bukan backup DEBT yang valid. Data tidak diubah.");
    return;
  }
  const incoming = parsed.debts.map(sanitizeDebt).filter(Boolean);
  if (!incoming.length){ toast("Tidak ada data hutang yang valid di file itu."); return; }
  let newDebts = 0, skipDebts = 0, newPays = 0, skipPays = 0;
  const plan = [];
  incoming.forEach(inc => {
    const ex = debts.find(d => d.id === inc.id);
    if (!ex){ newDebts++; newPays += inc.payments.length; plan.push({ inc, ex: null }); }
    else {
      skipDebts++;
      const addP = inc.payments.filter(p => !(ex.payments || []).some(ep => ep.id === p.id));
      newPays += addP.length; skipPays += inc.payments.length - addP.length;
      if (addP.length) plan.push({ inc, ex, addP });
    }
  });
  const people = new Set(incoming.map(d => personKey(d.name))).size;
  const ok = await confirmModal("Pulihkan dari Backup?",
    `File berisi ${incoming.length} catatan hutang dari ${people} orang (diekspor ${parsed.exportedAt ? fmtDate(String(parsed.exportedAt).slice(0,10)) : "—"}). Hasil gabung: ${newDebts} hutang baru ditambahkan, ${skipDebts} hutang dilewati (sudah ada), ${newPays} pembayaran ditambahkan, ${skipPays} pembayaran dilewati. Data yang sudah ada tidak dihapus.`,
    "Ya, Pulihkan");
  if (!ok) return;
  plan.forEach(({ inc, ex, addP }) => {
    if (!ex) debts.push(inc);
    else (ex.payments = ex.payments || []).push(...addP);
  });
  saveDebts(); render();
  toast(`Pemulihan selesai: ${newDebts} hutang & ${newPays} pembayaran ditambahkan.`);
});

/* ================= Unduh file HTML mandiri (untuk dibagikan) ================= */
function downloadStandalone(){
  const clone = document.documentElement.cloneNode(true);
  const q = (sel) => clone.querySelector(sel);
  const splash = q("#splash"); if (splash){ splash.classList.remove("hidden", "leaving"); }
  const lock = q("#lockScreen"); if (lock) lock.classList.add("hidden");
  const lockC = q("#lockContent"); if (lockC) lockC.innerHTML = "";
  const app = q("#app"); if (app) app.classList.add("hidden");
  const list = q("#list"); if (list) list.innerHTML = "";
  const modal = q("#modalRoot"); if (modal) modal.innerHTML = "";
  const search = q("#searchInput"); if (search) search.value = "";
  const toastEl = q("#toast"); if (toastEl){ toastEl.textContent = ""; toastEl.classList.remove("show"); }
  const html = "<!doctype html>\n" + clone.outerHTML;
  downloadBlob(html, "DEBT-Catat-Hutang.html", "text/html");
  toast("File DEBT terunduh. Kirim lewat WhatsApp/Bluetooth untuk membagikan.");
}
